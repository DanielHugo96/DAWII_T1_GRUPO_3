server.port=8082
spring.application.name=servicio-recargas

spring.datasource.url=jdbc:mysql://localhost:3306/tarjetasdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL directa del servicio de Tarjetas (sin Eureka). Si usas Eureka, cambia esto
# por el nombre del servicio y agrega @EnableDiscoveryClient + spring-cloud-starter-netflix-eureka-client.
tarjetas.service.url=http://localhost:8081

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


app.queue.name=Grupo3_Queue
app.exchange.name=paygo.exchange
app.routing.key=paygo.recargas.routingkey
