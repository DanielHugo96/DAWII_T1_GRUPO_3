server.port=8083
spring.application.name=servicio-riesgo

spring.datasource.url=jdbc:mysql://localhost:5510/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=app
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Debe coincidir EXACTAMENTE con la cola declarada en servicio-recargas
app.queue.name=Grupo3_Queue
app.exchange.name=paygo.exchange
app.routing.key=paygo.recargas.routingkey
